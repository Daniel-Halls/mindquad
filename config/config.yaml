# Mindquad Pipeline Configuration

# Project paths
raw_data_dir: "/imgshare/tES-FUS/pilot/dif_pilot"
bids_dir: "bids"
work_dir: "work"
tmp_dir: ".tmp"

# Subject identification
# Explicit subject list. If empty, common.smk discovers from raw_data_dir.
subjects:
  - "19081_001"

# Subject mapping: raw subject dir name -> BIDS label (without sub- prefix)
subject_mapping:
  "19081_001": "19081001"

# Resource limits (Max: 2 CPU cores as per system constraints)
threads: 2

# dcm2niix settings
dcm2niix:
  args: "-z y -b y -ba y -f %p_%s"
  module: "dcm2niix"

derivatives_dir: "derivatives"

# MRIQC configuration
mriqc:
  modalities:
    - "T1w"
    - "bold"
    - "dwi"
  threads: 2
  mem_gb: 8
  args: "--verbose-reports --no-sub"

# FastSurfer configuration
fastsurfer:
  module: "fastsurfer"
  threads: 2
  device: "cpu"
  fs_license: ""
  args: "--batch 1"

# fMRIPrep configuration
fmriprep:
  module: "fmriprep"
  threads: 2
  mem_mb: 8000
  output_spaces:
    - "MNI152NLin2009cAsym:res-2"
    - "fsaverage5"
  cifti_output: "91k"
  fs_license: ""
  fs_subjects_dir: "derivatives/fastsurfer"
  args: "--skip-bids-validation --notrack"

# QSIPrep configuration
qsiprep:
  module: "qsiprep"
  threads: 2
  mem_mb: 8000
  output_resolution: 1.5
  denoise_method: "dwidenoise"
  unringing_method: "mrdegibbs"
  separate_all_dwis: false
  fs_license: ""
  fs_subjects_dir: "derivatives/fastsurfer"
  args: "--skip-bids-validation --notrack"


# Coregistration configuration (Step 6: Co-register T2 to T1 with SyN)
coregistration:
  tool: "dipy"
  metric: "CC"
  transform_type: "syn"
  step_length: 0.25
  threads: 2
  args: ""


# HCP PostFreeSurfer configuration (Step 7: HCP postfreesurfer pipeline)
hcp:
  module: "hcppipelines"
  threads: 2
  processing_mode: "HCPStyleData"
  reg_name: "MSMSulc"
  grayordinates_res: 2
  hires_mesh: 164
  low_res_mesh: 32
  thickness_regression: "BOTH"
  surf_atlas_dir: ""
  grayordinates_dir: ""
  subcort_gray_labels: ""
  freesurfer_labels: ""
  ref_myelin_maps: ""
  args: ""


# MRS configuration (Step 8: MRS processing with FSL-MRS)
mrs:
  threads: 2
  basis: ""
  fit_algorithm: "Newton"
  ppm_range:
    - 0.2
    - 4.2
  baseline_order: 2
  internal_reference: "Cr"
  args: ""


# BIDS dataset metadata
dataset_description:
  Name: "tES-FUS Multimodal Neuroimaging Study"
  BIDSVersion: "1.9.0"
  DatasetType: "raw"
  License: "CC0"
  Authors:
    - "tES-FUS Research Team"
