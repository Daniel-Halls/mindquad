# Mindquad Pipeline Template Configuration
# Copy this file to your preferred location (e.g., custom_config.yaml) and modify as needed.

# ---------------------------------------------------------
# General Project Paths
# ---------------------------------------------------------
# (Optional) Global output directory for bids, work, and derivatives. (Default: ".")
output_dir: "."
# ---------------------------------------------------------
# (Mandatory) Absolute path to the raw DICOM data folder
raw_data_dir: "/path/to/your/raw/dataset"

# (Optional) Subdirectories to generate. (Defaults: bids, work, .tmp, derivatives)
bids_dir: "bids"
work_dir: "work"
tmp_dir: ".tmp"
derivatives_dir: "derivatives"

# ---------------------------------------------------------
# Subject Identification
# ---------------------------------------------------------
# (Optional) Explicit list of subject directory names to process.
# If left empty or omitted, the pipeline will auto-discover all non-hidden folders in `raw_data_dir`.
subjects:
  - "subject_01"
  - "subject_02"

# (Optional) Map raw directory names to BIDS participant labels (without the 'sub-' prefix).
subject_mapping:
  "subject_01": "01"
  "subject_02": "02"

# ---------------------------------------------------------
# Global Resource Limits
# ---------------------------------------------------------
# (Optional) Global fallback for maximum CPU threads per rule. (Default: 2)
threads: 4

# ---------------------------------------------------------
# Tool Configurations
# ---------------------------------------------------------

dcm2niix:
  load: "" # Put where dcm2niix is
  # e.g., load: "/path/to/dcm2niix.sif"
  args: "-z y -b y -ba y -f %p_%s"

mriqc:
  load: "" # Put where mriqc is (can be a .sif)
  modalities: ["T1w", "bold", "dwi"]
  threads: 4
  mem_gb: 8
  args: "--verbose-reports --no-sub"

fastsurfer:
  load: "extension/imaging fastsurfer-img 2>/dev/null || true; module load cuda-img"
  # e.g., load: "/path/to/fastsurfer.sif"
  threads: 4
  device: "cpu"
  fs_license: "/path/to/freesurfer/license.txt"
  args: "--batch 1"

fmriprep:
  load: ""
  # e.g., load: "/path/to/fmriprep.sif"
  threads: 4
  mem_mb: 8000
  output_spaces: ["MNI152NLin2009cAsym:res-2", "fsaverage5"]
  cifti_output: "91k"
  fs_license: "/path/to/freesurfer/license.txt"
  fs_subjects_dir: "derivatives/fastsurfer"
  args: "--skip-bids-validation --notrack"

qsiprep:
  load: ""
  # e.g., load: "/path/to/qsiprep.sif"
  threads: 4
  mem_mb: 8000
  output_resolution: 1.5
  denoise_method: "dwidenoise"
  unringing_method: "mrdegibbs"
  separate_all_dwis: false
  fs_license: "/path/to/freesurfer/license.txt"
  fs_subjects_dir: "derivatives/fastsurfer"
  args: "--skip-bids-validation --notrack"

coregistration:
  tool: "dipy"
  metric: "CC"
  transform_type: "syn"
  step_length: 0.25
  threads: 4
  args: ""

hcp:
  load: ""
  # e.g., load: "/path/to/hcp.sif"
  threads: 4
  processing_mode: "HCPStyleData"
  reg_name: "MSMSulc"
  grayordinates_res: 2
  hires_mesh: 164
  low_res_mesh: 32
  thickness_regression: "BOTH"
  surf_atlas_dir: ""
  grayordinates_dir: ""
  subcort_gray_labels: ""
  freesurfer_labels: ""
  ref_myelin_maps: ""
  args: ""

mrs:
  load: ""
  threads: 4
  basis: ""
  fit_algorithm: "Newton"
  ppm_range: [0.2, 4.2]
  baseline_order: 2
  internal_reference: "Cr"
  args: ""

# ---------------------------------------------------------
# BIDS Dataset Metadata
# ---------------------------------------------------------
dataset_description:
  Name: "Custom Neuroimaging Study"
  BIDSVersion: "1.9.0"
  DatasetType: "raw"
  License: "CC0"
  Authors:
    - "Your Name"
